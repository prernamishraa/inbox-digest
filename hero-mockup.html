<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox Digest — Hero Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0C0C0B;
      --amber: #FFD264;
      --amber-dim: rgba(255, 210, 100, 0.12);
      --amber-glow: rgba(255, 200, 80, 0.18);
      --text: #F0EDE6;
      --text-muted: rgba(240, 237, 230, 0.55);
      --border: rgba(240, 237, 230, 0.12);
      --input-bg: rgba(240, 237, 230, 0.04);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      opacity: 0.028;
      pointer-events: none;
      z-index: 0;
    }

    /* Amber glow top-right */
    body::after {
      content: '';
      position: fixed;
      top: -120px;
      right: -120px;
      width: 680px;
      height: 680px;
      background: radial-gradient(circle at center, rgba(255, 210, 80, 0.13) 0%, rgba(255, 190, 60, 0.06) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Hero */
    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }

    .hero-inner {
      max-width: 720px;
      width: 100%;
      text-align: left;
    }

    /* Eyebrow */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    .eyebrow::before {
      content: '';
      display: block;
      width: 20px;
      height: 1px;
      background: var(--amber);
      opacity: 0.7;
    }

    /* Headline */
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(52px, 8vw, 86px);
      font-weight: 400;
      line-height: 1.03;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.22s forwards;
    }

    h1 em {
      font-style: italic;
      color: var(--amber);
    }

    /* Subheading */
    .subheading {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(16px, 2.2vw, 19px);
      font-weight: 300;
      line-height: 1.65;
      color: var(--text-muted);
      max-width: 580px;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.36s forwards;
    }

    /* Form */
    .form-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
      max-width: 520px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    }

    .email-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      min-width: 0;
    }

    .email-input::placeholder {
      color: rgba(240, 237, 230, 0.3);
    }

    .email-input:focus {
      border-color: rgba(255, 210, 100, 0.4);
      background: rgba(240, 237, 230, 0.06);
    }

    .cta-btn {
      flex-shrink: 0;
      background: var(--amber);
      color: #0C0C0B;
      border: none;
      border-radius: 6px;
      padding: 14px 26px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s;
    }

    .cta-btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .cta-btn:active {
      transform: translateY(0);
      opacity: 1;
    }

    /* Hint text below form */
    .form-hint {
      margin-top: 14px;
      font-size: 12px;
      color: rgba(240, 237, 230, 0.28);
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.62s forwards;
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile */
    @media (max-width: 540px) {
      .form-row {
        flex-direction: column;
        max-width: 100%;
      }

      .cta-btn {
        width: 100%;
        padding: 15px;
        text-align: center;
      }

      h1 {
        font-size: 46px;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-inner">

      <span class="eyebrow">Early Access</span>

      <h1>Stop reading.<br><em>Start knowing.</em></h1>

      <p class="subheading">
        Inbox Digest sits in your Gmail, reads every newsletter you are subscribed to, and sends you one clean digest every morning. You get the signal. The AI takes the noise.
      </p>

      <div class="form-row">
        <input
          class="email-input"
          type="email"
          placeholder="your@email.com"
          autocomplete="email"
        />
        <button class="cta-btn">Join the waitlist</button>
      </div>

      <p class="form-hint">No spam. Unsubscribe any time.</p>

    </div>
  </section>

</body>
</html>
